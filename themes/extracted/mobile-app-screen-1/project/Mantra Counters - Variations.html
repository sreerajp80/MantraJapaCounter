<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mantra Counters — 3 Variations</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; background: #f0eee9; }
  body { font-family: 'Inter Tight', system-ui, sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="variations/sandalwood.jsx"></script>
<script type="text/babel" src="variations/sunrise.jsx"></script>
<script type="text/babel" src="variations/temple.jsx"></script>

<script type="text/babel">
const { useState } = React;

// Phone wrapper that shows our screen inside the AndroidDevice frame
function Phone({ children, dark = false }) {
  return (
    <div data-screen-label={undefined} style={{ display: 'flex', justifyContent: 'center' }}>
      <AndroidDevice width={380} height={780} dark={dark}>
        {children}
      </AndroidDevice>
    </div>
  );
}

const ART_W = 396;   // 380 phone + 8px border * 2
const ART_H = 800;

function App() {
  return (
    <DesignCanvas>
      {/* ────────────── A · Sandalwood (Light, Serene) ────────────── */}
      <DCSection
        id="sandalwood"
        title="A · Sandalwood"
        subtitle="Serene · light · cream + saffron + ochre · Fraunces serif numerals + Nunito sans · subtle mandala motifs"
      >
        <DCArtboard id="sw-list" label="01 · Counter list" width={ART_W} height={ART_H}>
          <Phone><SandalwoodList/></Phone>
        </DCArtboard>
        <DCArtboard id="sw-counter" label="02 · Active counter" width={ART_W} height={ART_H}>
          <Phone><SandalwoodCounter/></Phone>
        </DCArtboard>
        <DCArtboard id="sw-history" label="03 · History" width={ART_W} height={ART_H}>
          <Phone><SandalwoodHistory/></Phone>
        </DCArtboard>
        <DCArtboard id="sw-settings" label="04 · Settings" width={ART_W} height={ART_H}>
          <Phone><SandalwoodSettings/></Phone>
        </DCArtboard>
      </DCSection>

      {/* ────────────── B · Sunrise (Dark, Gamified) ────────────── */}
      <DCSection
        id="sunrise"
        title="B · Sunrise"
        subtitle="Devotional · dark · plum-night + marigold + magenta · Manrope display · sadhana ring, mala progress, heatmap"
      >
        <DCArtboard id="sr-list" label="01 · Counter list" width={ART_W} height={ART_H}>
          <Phone dark><SunriseList/></Phone>
        </DCArtboard>
        <DCArtboard id="sr-counter" label="02 · Active counter" width={ART_W} height={ART_H}>
          <Phone dark><SunriseCounter/></Phone>
        </DCArtboard>
        <DCArtboard id="sr-history" label="03 · History" width={ART_W} height={ART_H}>
          <Phone dark><SunriseHistory/></Phone>
        </DCArtboard>
        <DCArtboard id="sr-settings" label="04 · Settings" width={ART_W} height={ART_H}>
          <Phone dark><SunriseSettings/></Phone>
        </DCArtboard>
      </DCSection>

      {/* ────────────── C · Temple (Light, Devotional) ────────────── */}
      <DCSection
        id="temple"
        title="C · Temple"
        subtitle="Devotional · light · cream + temple vermillion + sandal yellow + tulsi green · EB Garamond italics + Inter · arches, lotus medallions, mala beads"
      >
        <DCArtboard id="tp-list" label="01 · Counter list" width={ART_W} height={ART_H}>
          <Phone><TempleList/></Phone>
        </DCArtboard>
        <DCArtboard id="tp-counter" label="02 · Active counter" width={ART_W} height={ART_H}>
          <Phone><TempleCounter/></Phone>
        </DCArtboard>
        <DCArtboard id="tp-history" label="03 · History" width={ART_W} height={ART_H}>
          <Phone><TempleHistory/></Phone>
        </DCArtboard>
        <DCArtboard id="tp-settings" label="04 · Settings" width={ART_W} height={ART_H}>
          <Phone><TempleSettings/></Phone>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
