name: mantra_japa_counter
description: SreerajP MantraJapa Counter — track your mantra recitation practice.
publish_to: 'none'
version: 6.10.2+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Localization (English + Malayalam)
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.2

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Key-value storage
  shared_preferences: ^2.5.3

  # Notifications
  flutter_local_notifications: ^21.0.0

  # File picker (audio tone selection)
  file_picker: ^11.0.2

  # Audio playback for the configured notification tone
  audioplayers: ^6.1.0

  # Export / share & optical sync
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2

  # Logging
  logger: ^2.5.0

  # App version (reads from pubspec.yaml at runtime)
  package_info_plus: ^9.0.1

  # UUID generation (RFC 4122 v4)
  uuid: ^4.5.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/

  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/EBGaramond-VariableFont.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-VariableFont.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-Italic-VariableFont.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/EBGaramond-Italic-VariableFont.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/EBGaramond-Italic-VariableFont.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/EBGaramond-Italic-VariableFont.ttf
          weight: 700
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 500
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMalayalam-VariableFont.ttf
          weight: 500
        - asset: assets/fonts/NotoSansMalayalam-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/NotoSansMalayalam-VariableFont.ttf
          weight: 700
