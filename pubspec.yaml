name: mantra_japa_counter
description: SreerajP MantraJapa Counter — track your mantra recitation practice.
publish_to: 'none'
version: 6.13.8+39

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Localization (English + Malayalam + Sanskrit)
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^18.0.2

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Key-value storage
  shared_preferences: ^2.5.3

  # Notifications
  flutter_local_notifications: ^22.3.1

  # File picker (audio tone selection)
  file_picker: ^13.1.0

  # Audio playback for the configured notification tone
  audioplayers: ^6.1.0

  # Export / share & optical sync
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0

  # Live camera frames for Optical Sync receive. Frames are decoded on the
  # device by ZXing core (see android/app/build.gradle.kts). No ML Kit, so no
  # Google telemetry and no network permission.
  camera: ^0.12.1

  # App version (reads from pubspec.yaml at runtime)
  package_info_plus: ^10.2.2

  # UUID generation (RFC 4122 v4)
  uuid: ^4.5.1

  # Optional export encryption (AES-256-GCM + PBKDF2) — pure Dart, no network
  cryptography: ^2.7.0

  # Material and Cupertino widgets (moved out of the Flutter SDK in 3.47).
  # Pinned on purpose. Upgrade only via the UI package upgrade checklist in
  # docs/release_process.md.
  material_ui: 1.5.0
  cupertino_ui: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Test-only: runs sqflite on the desktop VM so database migration tests
  # can open an in-memory database. Never shipped in the app.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/
    - assets/audio/

  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/EBGaramond-VariableFont.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-VariableFont.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-Italic-VariableFont.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/EBGaramond-Italic-VariableFont.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/EBGaramond-Italic-VariableFont.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/EBGaramond-Italic-VariableFont.ttf
          weight: 700
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 500
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/Inter-VariableFont.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMalayalam-VariableFont.ttf
          weight: 500
        - asset: assets/fonts/NotoSansMalayalam-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/NotoSansMalayalam-VariableFont.ttf
          weight: 700
