# Weekly update pull requests. Nothing is merged automatically.
# Each update still needs its own plan and change log before merging.
# See docs/release_process.md section 17.
version: 2
updates:
  # Dart packages in pubspec.yaml. One pull request per package, so the
  # material_ui / cupertino_ui upgrades stay in their own change (section 16).
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # AGP, Kotlin, Gradle wrapper and Android libraries.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # The docs/guidelines submodule.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
